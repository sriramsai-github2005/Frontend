<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog Layout</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; }
header { background-color: #333; color: white; padding: 20px; text-align: center; }
.container {  margin: 20px auto; }
.main { width: 70%; float: left; padding: 20px; box-sizing: border-box; }
.sidebar { width: 28%; float: right; padding: 20px; box-sizing: border-box; background-color: #f4f4f4; }
footer { clear: both; background-color: #333; color: white; text-align: center; padding: 10px; }
article { margin-bottom: 20px; }
</style>
</head>
<body>

<header>
    <h1>My Blog</h1>
</header>

<div class="container">
    <div class="main">
        <article>
            <h2>Blog Post 1</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        </article>
        <article>
            <h2>Blog Post 2</h2>
            <p>Praesent vel ligula scelerisque, vehicula dui eu, fermentum velit.</p>
        </article>
    </div>
    <div class="sidebar">
        <h3>About Me</h3>
        <p>This is the sidebar content. You can put profile info, links, or ads here.</p>
    </div>
</div>

<footer>
    &copy; 2026 My Blog
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dropdown Menu</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}
nav {
    background-color: #333;
    overflow: hidden;
}
nav ul {
    margin: 0;
    padding: 0;
    list-style: none;
}
nav ul li {
    float: left;
    position: relative;
}
nav ul li a {
    display: block;
    padding: 14px 20px;
    color: white;
    text-decoration: none;
}
nav ul li a:hover {
    background-color: #555;
}
nav ul li ul {
    display: none;
    position: absolute;
    background-color: #555;
    min-width: 150px;
}


</style>
</head>
<body>

<nav>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Services</a>
            <ul>
                <li><a href="#1">Web Design</a></li>
                <li><a href="#1">SEO</a></li>
            </ul>
        </li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

</body>
</html>

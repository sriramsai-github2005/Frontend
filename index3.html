<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pricing Table</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
h1 { text-align: center; }
.pricing-box {
    width: 30%;
    display: inline-block;
    margin: 1.5%;
    padding: 20px;
    border: 1px solid #ccc;
    text-align: center;
    box-sizing: border-box;
}
.pricing-box h2 { margin-top: 0; }
.pricing-box button {
    padding: 10px 20px;
    background-color: #333;
    color: white;
    border: none;
    cursor: pointer;
}
.pricing-box button:hover {
    background-color: #555;
}
</style>
</head>
<body>

<h1>Pricing Plans</h1>
<div class="pricing-box">
    <h2>Basic</h2>
    <p>$10 / month</p>
    <button>Choose</button>
</div>
<div class="pricing-box">
    <h2>Standard</h2>
    <p>$20 / month</p>
    <button>Choose</button>
</div>
<div class="pricing-box">
    <h2>Premium</h2>
    <p>$30 / month</p>
    <button>Choose</button>
</div>

</body>
</html>
